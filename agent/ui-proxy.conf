pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 512;
}

http {
    access_log off;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    server {
        listen 4097;
        client_max_body_size 25m;

        location = /healthz {
            access_log off;
            return 204;
        }

        location / {
            auth_basic "OpenCode";
            auth_basic_user_file /run/secrets/opencode_htpasswd;
            proxy_pass http://opencode:4096;
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_request_buffering off;
            # Preserve long-lived chat/WebSocket sessions across idle periods.
            proxy_read_timeout 7d;
            proxy_send_timeout 7d;
            proxy_set_header Host $http_host;
            # Fixed, non-secret credential for the internal OpenCode hop. The
            # browser-facing random password is validated above by auth_basic.
            proxy_set_header Authorization "Basic b3BlbmNvZGU6bm9uc2VjcmV0LWludGVybmFsLXYx";
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }
    }
}
