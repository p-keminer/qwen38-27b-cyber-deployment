name: qwen-eval-agent

services:
  model-gateway:
    build:
      context: .
      dockerfile: Dockerfile.gateway
    image: qwen-eval/model-gateway:1
    container_name: qwen-eval-model-gateway
    restart: unless-stopped
    environment:
      RUNPOD_SSH_HOST: ${RUNPOD_SSH_HOST:?RUNPOD_SSH_HOST is required}
      RUNPOD_SSH_PORT: ${RUNPOD_SSH_PORT:?RUNPOD_SSH_PORT is required}
      RUNPOD_SSH_USER: ${RUNPOD_SSH_USER:?RUNPOD_SSH_USER is required}
      RUNPOD_REMOTE_PORT: ${RUNPOD_REMOTE_PORT:-8080}
    volumes:
      - type: bind
        source: ${RUNPOD_IDENTITY_FILE:?RUNPOD_IDENTITY_FILE is required}
        target: /run/secrets/ssh_identity
        read_only: true
      - type: bind
        source: ${RUNPOD_KNOWN_HOSTS_FILE:?RUNPOD_KNOWN_HOSTS_FILE is required}
        target: /run/secrets/known_hosts
        read_only: true
      - type: bind
        source: ${RUNPOD_API_KEY_FILE:?RUNPOD_API_KEY_FILE is required}
        target: /run/secrets/model_api_key
        read_only: true
    networks:
      agent-internal:
        ipv4_address: 172.30.240.2
      gateway-egress: {}
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=16m,mode=1777
      - /var/cache/nginx:rw,nosuid,nodev,noexec,size=32m,mode=0700
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 256m
    cpus: 0.50
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "--max-time", "5", "http://127.0.0.1:18081/health"]
      interval: 5s
      timeout: 6s
      retries: 24
      start_period: 5s

  opencode:
    build:
      context: .
      dockerfile: Dockerfile.opencode
    image: qwen-eval/opencode:0.0.0-beta-17898
    container_name: qwen-eval-opencode
    labels:
      qwen-eval.runtime-mode: unbounded-interactive-v1
      qwen-eval.primary-interface: opencode-chat
      qwen-eval.network-mode: offline-v1
    restart: unless-stopped
    depends_on:
      model-gateway:
        condition: service_healthy
    environment:
      LLAMACPP_BASE_URL: http://model-gateway:18081/v1
      OPENCODE_DISABLE_AUTOUPDATE: "true"
      # OpenCode requires an upstream credential. This fixed value is not the
      # user's GUI secret; only the UI proxy accepts the random GUI password.
      OPENCODE_SERVER_USERNAME: opencode
      OPENCODE_SERVER_PASSWORD: nonsecret-internal-v1
    working_dir: /workspace/agent-workspace
    volumes:
      - type: bind
        source: ${QWEN_PROJECT_ROOT:?QWEN_PROJECT_ROOT is required}
        target: /workspace
      - type: volume
        source: opencode-state
        target: /home/opencode/.local/share
      - type: volume
        source: opencode-config
        target: /home/opencode/.config
      - type: volume
        source: opencode-cache
        target: /home/opencode/.cache
    dns:
      - 127.0.0.1
    extra_hosts:
      model-gateway: "172.30.240.2"
    networks:
      agent-internal: {}
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=256m,mode=1777
      - /home/opencode/.opencode:rw,nosuid,nodev,noexec,size=32m,mode=0700,uid=10001,gid=10001
      - /workspace/.runpod:rw,nosuid,nodev,noexec,size=1m,mode=0700,uid=10001,gid=10001
      - /workspace/cache:rw,nosuid,nodev,noexec,size=1m,mode=0700,uid=10001,gid=10001
      - /workspace/artifacts:rw,nosuid,nodev,noexec,size=1m,mode=0700,uid=10001,gid=10001
      - /workspace/results:rw,nosuid,nodev,noexec,size=1m,mode=0700,uid=10001,gid=10001
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 4g
    cpus: 4.0
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4096',{headers:{authorization:'Basic b3BlbmNvZGU6bm9uc2VjcmV0LWludGVybmFsLXYx'}}).then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 10s

  ui-proxy:
    build:
      context: .
      dockerfile: Dockerfile.ui-proxy
    image: qwen-eval/ui-proxy:1
    container_name: qwen-eval-ui-proxy
    restart: unless-stopped
    depends_on:
      opencode:
        condition: service_healthy
    volumes:
      - type: bind
        source: ${OPENCODE_HTPASSWD_FILE:?OPENCODE_HTPASSWD_FILE is required}
        target: /run/secrets/opencode_htpasswd
        read_only: true
    ports:
      - "127.0.0.1:${OPENCODE_WEB_PORT:-4096}:4097"
    networks:
      - agent-internal
      - ui-ingress
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=8m,mode=1777
      - /var/cache/nginx:rw,nosuid,nodev,noexec,size=32m,mode=0700,uid=101,gid=101
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 32
    mem_limit: 128m
    cpus: 0.25
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "--max-time", "5", "http://127.0.0.1:4097/healthz"]
      interval: 5s
      timeout: 6s
      retries: 12
      start_period: 5s

networks:
  agent-internal:
    internal: true
    ipam:
      config:
        - subnet: 172.30.240.0/24
  gateway-egress: {}
  ui-ingress: {}

volumes:
  opencode-state: {}
  opencode-config: {}
  opencode-cache: {}
