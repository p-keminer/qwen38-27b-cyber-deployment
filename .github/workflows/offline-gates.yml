name: Offline gates

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-and-shell:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install pinned uv
        run: python -m pip install --disable-pip-version-check uv==0.12.5
      - name: Sync locked environment
        run: uv sync --frozen
      - name: Python unit tests
        run: uv run python -m unittest discover -s tests
      - name: Python and manifest gates
        run: |
          uv run python scripts/validate_model_manifest.py
          uv run python scripts/validate_runpod_deployment_manifest.py --manifest config/runpod-a100-pcie-deployment.json --quiet
          uv run python - <<'PY'
          import ast
          from pathlib import Path
          for path in Path('.').rglob('*.py'):
              if '.venv' in path.parts:
                  continue
              source = path.read_text(encoding='utf-8')
              ast.parse(source, filename=str(path))
              compile(source, str(path), 'exec')
          PY
      - name: Bash syntax
        run: git ls-files '*.sh' | xargs -r -n1 bash -n
      - name: Whitespace
        run: git diff --check 4b825dc642cb6eb9a060e54bf8d69288fbee4904 HEAD

  windows-contract:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: PowerShell parser
        shell: powershell
        run: |
          $files = @(git ls-files '*.ps1' '*.psm1')
          foreach ($path in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path -LiteralPath $path),
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -ne 0) { throw "$path failed to parse." }
          }
      - name: Mutation-free deployment dry-run
        shell: powershell
        run: |
          $result = .\scripts\runpod-provision.ps1 -OutputFormat Json | ConvertFrom-Json
          if ($result.mode -ne 'dry_run' -or $result.mutation_performed -ne $false) {
            throw 'Dry-run reported a mutation.'
          }
          if (Test-Path '.runpod\deployments\a100-pcie-80gb-q6-v1\state.json') {
            throw 'Dry-run created state.json.'
          }
          if (@(git status --porcelain --untracked-files=all).Count -ne 0) {
            throw 'Dry-run created unignored repository state.'
          }
      - name: True fresh-clone distribution gate
        shell: powershell
        run: .\scripts\test-fresh-clone.ps1 -UseHostTools -SkipUnitTests
